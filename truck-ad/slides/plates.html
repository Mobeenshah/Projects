<!doctype html>
<html><head><meta charset="utf-8"><title>Bumper Plates</title>
<style>
@font-face{font-family:NastaliqB;src:url(../poster/fonts/nastaliq-700.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
.plate{display:flex;align-items:center;justify-content:center;font-family:NastaliqB;direction:rtl;position:relative}
/* front bumper: yellow board, red frame, red lettering */
.front{width:330px;height:120px;background:#f4c430;border:11px solid #c8281e;border-radius:12px;color:#c8281e;font-size:78px;line-height:1}
.front span{transform:translateY(-24px)}
/* rear bumper: blue board, dotted yellow frame, yellow lettering between two flowers */
.rear{width:640px;height:100px;background:#1f3f9a;border-radius:8px;color:#ffd23a;font-size:62px;line-height:1;gap:22px;
  box-shadow:inset 0 0 0 5px #1f3f9a,inset 0 0 0 9px #ffd23a}
.rear span{transform:translateY(-19px)}
.rear i{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#ffd23a 0 5px,#d8341f 6px 13px,transparent 14px),
  conic-gradient(from 0deg,#d8341f 0 12%,transparent 12% 25%,#d8341f 25% 37%,transparent 37% 50%,#d8341f 50% 62%,transparent 62% 75%,#d8341f 75% 87%,transparent 87%)}
</style></head><body>
<div id="c"></div>
<script>
const [kind, txt] = decodeURIComponent(location.hash.slice(1)).split('|');
document.getElementById('c').innerHTML = kind === 'front'
  ? `<div class="plate front"><span>${txt}</span></div>`
  : `<div class="plate rear"><i></i><span>${txt}</span><i></i></div>`;
</script></body></html>
