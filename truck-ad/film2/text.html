<!doctype html>
<html><head><meta charset="utf-8"><title>Diaspora Captions</title>
<style>
@font-face{font-family:Nastaliq;src:url(../poster/fonts/nastaliq-400.woff2)}
@font-face{font-family:NastaliqB;src:url(../poster/fonts/nastaliq-700.woff2)}
@font-face{font-family:Playfair;src:url(../poster/fonts/playfair-italic.woff2);font-style:italic}
@font-face{font-family:Oswald;src:url(../poster/fonts/oswald-500.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
.wrap{position:absolute;left:90px;right:90px;text-align:center;color:#fff8ea;
  text-shadow:0 2px 18px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.6)}
.low{bottom:300px}.mid{top:50%;transform:translateY(-50%)}
.ur{font-family:Nastaliq;direction:rtl;font-size:66px;line-height:1.9}
.en{font:italic 54px/1.3 Playfair;margin-top:6px}
.big{font-family:NastaliqB;direction:rtl;font-size:150px;line-height:1.8;color:#f3c84b}
.tag{font:italic 60px/1.3 Playfair}
.sm{font:500 26px/1.5 Oswald;letter-spacing:.22em;text-transform:uppercase;opacity:.85;margin-top:36px}
.cr{font:500 20px Oswald;letter-spacing:.12em;opacity:.6;position:absolute;bottom:-420px;left:0;right:0}
.rule{width:120px;height:2px;background:#f3c84b;margin:34px auto}
</style></head><body>
<div id="c"></div>
<script>
