<!doctype html>
<html><head><meta charset="utf-8"><title>Zedem Bazaar Closing Card</title>
<style>
@font-face{font-family:Nastaliq;src:url(../poster/fonts/nastaliq-700.woff2)}
@font-face{font-family:Abril;src:url(../poster/fonts/abril.woff2)}
@font-face{font-family:Oswald;src:url(../poster/fonts/oswald-700.woff2);font-weight:700}
@font-face{font-family:Oswald;src:url(../poster/fonts/oswald-500.woff2);font-weight:500}
@font-face{font-family:Playfair;src:url(../poster/fonts/playfair-italic.woff2);font-style:italic}
:root{--cream:#fdf0dc;--red:#d83a20;--blue:#1f4fa0;--yellow:#ffb400;--green:#1d8a4a;--ink:#1b1a2a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
body{font-family:Oswald;color:var(--ink)}
/* truck-art border in the logo's colours */
.b1{position:absolute;inset:34px;border:16px solid var(--blue);border-radius:6px}
.b2{position:absolute;inset:56px;border:10px solid var(--yellow)}
.b3{position:absolute;inset:72px;border:6px solid var(--red)}
.dots{position:absolute;inset:90px;border:12px solid transparent;
  border-image:radial-gradient(circle,var(--green) 0 4px,transparent 5px) 12 / 12px round}
.page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:128px;text-align:center}
.logo{width:270px}
.head{font:96px/1 Abril;color:var(--red);margin-top:34px}
.headu{font-family:Nastaliq;direction:rtl;font-size:58px;line-height:1.6;color:var(--blue);margin-top:30px}
.stage{position:relative;width:900px;height:520px;margin-top:-10px}
.sun{position:absolute;left:50%;top:52%;width:820px;height:820px;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,180,0,.30) 0 7deg,transparent 7deg 14deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 68%);mask:radial-gradient(circle,#000 30%,transparent 68%)}
.truck{position:absolute;left:47%;top:52%;width:520px;transform:translate(-50%,-50%);
  filter:drop-shadow(0 26px 22px rgba(60,30,10,.35))}
.tag{position:absolute;right:40px;top:10px;width:210px;height:210px;border-radius:50%;background:var(--red);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(10deg);
  box-shadow:0 0 0 6px var(--cream),0 0 0 11px var(--red)}
.tag b{font:700 30px/1.05 Oswald;letter-spacing:.06em}
.tag i{font:italic 24px Playfair;color:var(--yellow);margin-top:6px;font-style:italic}
.city{display:flex;align-items:center;gap:26px;margin-top:6px}
.city .lab{font:700 30px Oswald;letter-spacing:.18em;color:var(--green);text-align:right;line-height:1.2}
.city .name{font-family:Nastaliq;direction:rtl;font-size:84px;line-height:1.45;color:var(--yellow);
  background:var(--green);padding:0 34px 26px;border-radius:14px;box-shadow:inset 0 0 0 5px var(--green),inset 0 0 0 8px var(--yellow)}
.feat{font:500 28px/1.5 Oswald;letter-spacing:.14em;text-transform:uppercase;margin-top:26px;color:var(--ink)}
.feat span{color:var(--red);margin:0 10px}
.gift{font:italic 40px/1.3 Playfair;color:var(--blue);margin-top:24px}
.cta{margin-top:28px;background:var(--red);color:#fff;font:700 48px Oswald;letter-spacing:.12em;
  padding:22px 60px;border-radius:60px;box-shadow:0 8px 0 #9e2914}
.cta small{display:block;font:500 26px Oswald;letter-spacing:.3em;color:var(--yellow);margin-top:4px}
</style></head>
<body>
<div class="b1"></div><div class="b2"></div><div class="b3"></div><div class="dots"></div>
<div class="page">
  <img class="logo" src="../brand/zedem_logo_transparent.png" alt="">
  <div class="head">Bring home closer.</div>
  <div class="headu">گھر کو اپنے پاس رکھیں</div>
  <div class="stage">
    <div class="sun"></div>
    <img class="truck" src="../poster/assets/truck_ai_cutout.png" alt="">
    <div class="tag"><b>MADE<br>TO<br>ORDER</b><i>hand-finished</i></div>
  </div>
  <div class="city">
    <div class="lab">YOUR CITY<br>ON THE<br>TAILGATE</div>
    <div class="name" id="city">لاہور</div>
  </div>
  <div class="feat">Truck art<span>✦</span>3D-printed<span>✦</span>Ships worldwide</div>
  <div class="gift">Gift a piece of home to someone far away.</div>
  <div class="cta">ORDER NOW<small>LINK IN BIO</small></div>
</div>
<script>
const c = {lahore:'لاہور', karachi:'کراچی', peshawar:'پشاور'}[location.hash.slice(1)];
if (c) document.getElementById('city').textContent = c;
</script>
</body></html>
