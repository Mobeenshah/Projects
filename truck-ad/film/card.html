<!doctype html>
<html><head><meta charset="utf-8"><title>Film Title Card</title>
<style>
@font-face{font-family:Nastaliq;src:url(../poster/fonts/nastaliq-700.woff2)}
@font-face{font-family:Abril;src:url(../poster/fonts/abril.woff2)}
@font-face{font-family:Oswald;src:url(../poster/fonts/oswald-700.woff2)}
@font-face{font-family:Playfair;src:url(../poster/fonts/playfair-italic.woff2);font-style:italic}
@font-face{font-family:Lobster;src:url(../poster/fonts/lobster.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#fff;overflow:hidden}
.border{position:absolute;inset:40px;border:34px solid #c3312a}
.border::before{content:"";position:absolute;inset:-34px;padding:34px;
  background:radial-gradient(circle,#e9b821 0 6px,transparent 7px) 0 0/34px 34px;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.inner{position:absolute;inset:92px;border:4px solid #17603a}
.inner::after{content:"";position:absolute;inset:8px;border:2px solid #17603a}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#1d1a17;padding:0 150px}
.urdu{font-family:Nastaliq;direction:rtl;color:#c3312a;line-height:1.8}
.sm{font:italic 50px/1.3 Playfair;color:#c3312a}
.osw{font:700 34px Oswald;letter-spacing:.3em;color:#17603a;padding-left:.3em}
.big{font:120px/1 Abril;color:#17603a}
.badge{font:84px/1 Oswald;color:#e9b821;background:#17603a;padding:22px 40px 16px;letter-spacing:.05em;box-shadow:0 0 0 6px #fff,0 0 0 11px #17603a}
.d{width:16px;height:16px;background:#c3312a;transform:rotate(45deg);margin:34px auto}
.lob{font:72px/1.2 Lobster;color:#c3312a}
</style></head>
<body>
<div class="border"></div><div class="inner"></div>
<div class="c" id="c"></div>
<script>
const cards = {
  title: `<div class="urdu" style="font-size:96px">شاہین ٹرانسپورٹ</div>
    <div class="badge">SHAHEEN</div>
    <div class="osw" style="margin-top:44px">GOODS TRANSPORT CO.</div>
    <div class="d"></div>
    <div class="sm">proudly presents</div>
    <div class="big" style="margin-top:40px">THE<br>GRAND<br>TRUNK<br>KING</div>
    <div class="d"></div>
    <div class="osw" style="font-size:28px">KARACHI · 1972</div>`,
  message: `<div class="sm" style="font-size:62px">…and wherever<br>she travels,</div>
    <div class="d"></div>
    <div class="sm" style="font-size:62px">she carries<br>one message —</div>`,
};
document.getElementById('c').innerHTML = cards[location.hash.slice(1)];
</script>
</body></html>
